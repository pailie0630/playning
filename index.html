<script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app'),nav=$('#nav');
const subs=['국어','수학','영어','사회','과학'], jobs=['문장 마법사','수식 기사','언어 탐험가','사회 전략가','과학 연금술사'], monsters=['문장 슬라임','분수 골렘','문법 박쥐','지도 유령','원소 드래곤'];
const quizzes=[['‘아주 빠르다’에서 ‘아주’의 품사는?','부사','동사','명사',0],['3/4 + 1/4의 값은?','1/2','1','2',1],['She ___ to school every day.','go','going','goes',2],['시장 가격을 결정하는 두 요소는?','기온과 강수량','수요와 공급','위도와 경도',1],['물의 화학식은?','H₂O','CO₂','O₂',0]];
const store='playning.html.v1', clothes=['기본 모험복','달빛 후드','오로라 로브'];
let db=JSON.parse(localStorage.getItem(store)||'{"users":{}}'),id=sessionStorage.getItem(store)||'',p=db.users[id],page=p?(p.ready?'홈':'목표'):'로그인',q=0,hits=[],battle=0,audio=null,musicTick=null;
const save=()=>localStorage.setItem(store,JSON.stringify(db));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(name){return {name, cash:0,xp:0,job:0,outfit:0,owned:[0],subjects:[...subs],log:[],cleared:[],requests:[],attendance:[],missions:{},ready:false}}
function openUser(key){id=key;p=db.users[key];sessionStorage.setItem(store,key);go(p.ready?'홈':'목표')}
function go(next){page=next;render();scrollTo(0,0)}
let toastTimer;function say(t){$('#msg').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#msg').textContent='',2600)}
function btn(text,action,arg='',cls=''){return '<button type="button" class="'+cls+'" data-act="'+action+'" data-arg="'+esc(arg)+'">'+esc(text)+'</button>'}
function field(label,name,type='text',val='',attrs='required'){return '<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(val)+'" '+attrs+'></label>'}
function panel(title,content){return '<section class="panel"><h2>'+esc(title)+'</h2>'+content+'</section>'}
function row(left,right){return '<div class="row"><span>'+left+'</span>'+right+'</div>'}
function dateKey(d=new Date()){return [d.getFullYear(),d.getMonth()+1,d.getDate()].join('-')}
function startOfWeek(){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return +d}
function elapsed(since=0,subject=''){const now=Date.now();let ms=0;for(const item of p.running?[...p.log,{...p.running,end:now}]:p.log){if(!subject||item.subject===subject)ms+=Math.max(0,item.end-Math.max(item.start,since))}return Math.floor(ms/1000)}
const clock=n=>[Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(v=>String(v).padStart(2,'0')).join(':');
function stop(){if(!p.running)return;let old=elapsed(0,p.running.subject);let item=p.running;p.running=null;let before=elapsed(0,item.subject);p.log.push({...item,end:Date.now()});let coins=Math.floor(old/60)-Math.floor(before/60);p.cash+=coins;p.xp+=2*coins;save()}
const goBtn=(t,d)=>btn(t,'go',d);
function auth(){let reg=page==='회원가입';return '<div class="logo" role="img" aria-label="Playning, 공부를 플레이하다"></div><form id="auth"><h2>'+page+'</h2>'+(reg?field('이름','name')+field('전화번호 (선택)','phone','tel','',''):'')+field('아이디','id','text','','required pattern="[A-Za-z0-9_]{3,24}" title="영문, 숫자, 밑줄 3~24자" autocomplete="username"')+field('비밀번호','pwd','password','','required minlength="6"')+(reg?field('비밀번호 확인','confirm','password'):'')+'<button>'+page+'</button></form><div class="grid">'+goBtn(reg?'로그인으로 돌아가기':'회원가입',reg?'로그인':'회원가입')+btn('바로 체험하기','guest')+'</div><p class="muted">계정과 기록은 이 브라우저에 저장돼요.</p>'}
function goals(){return '<form id="goals">'+field('희망 진로','career','text',p.career)+field('목표 대학','univ','text',p.univ)+field('현재 등급','grade','number',p.grade||3,'required min="1" max="9" step="0.1"')+field('목표 등급','target','number',p.target||2,'required min="1" max="9" step="0.1"')+field('하루 목표 (분)','minutes','number',p.minutes||60,'required min="1" max="1440"')+field('나의 목표','goal','text',p.goal,'maxlength="200"')+'<button>'+(p.ready?'저장':'저장하고 첫 테스트')+'</button></form>'}
function quiz(index){let a=quizzes[index];return panel(subs[index],'<h2>'+a[0]+'</h2>'+a.slice(1,4).map((v,i)=>btn(v,'answer',i,'wide')).join(''))}
function home(){let today=elapsed(+new Date().setHours(0,0,0,0));return '<div class="hero" role="img" aria-label="헤드폰을 쓴 모험가" style="filter:hue-rotate('+[0,50,125][p.outfit]+'deg)"></div><h1>'+esc(p.name)+'의 모험</h1><span class="pill">Lv. '+(1+Math.floor(p.xp/100))+' · '+jobs[p.job]+'</span> '+esc(clothes[p.outfit])+panel('오늘의 공부',row('<b class="time">'+clock(today)+'</b>','목표 '+Math.min(100,Math.floor(today/(p.minutes*60)*100))+'%')+'<progress class="bar" max="100" value="'+p.xp%100+'"></progress><small>'+p.xp%100+' / 100 XP · '+p.cash+' 캐시</small>')+'<div class="grid">'+btn('학습 멘토','go','학습 멘토','feature')+btn('스터디 던전','go','스터디 던전','feature')+goBtn('공부 시작','타이머')+goBtn('학습 계획','목표')+goBtn('친구 찾기','친구')+goBtn('협력 미션','미션')+'</div>'+panel('출석 체크',p.attendance.includes(dateKey())?'오늘 출석 완료 · 누적 '+p.attendance.length+'일':btn('출석하고 20 캐시 받기','check','','primary'))}
function timer(){return '<div class="digits" id="sum"></div>'+panel('과목별 공부 시간',p.subjects.map((s,i)=>row(esc(s)+' <b class="time" data-clock="'+i+'"></b>',btn(p.running?.subject===s?'■ 종료':'▶ 시작','timer',i))).join(''))+'<form id="subject">'+field('과목 추가','subject','text','','required maxlength="20"')+'<button>추가</button></form>'}
const peers=[['은하',2,1,'수학 · 물리'],['나래',4,2,'영어 · 국어'],['하늘',6,4,'사회 · 역사'],['여울',8,5,'과학 · 코딩']];
function friends(){return panel('나의 학습 목표',esc(p.career)+' · '+esc(p.univ)+'<br>현재 '+p.grade+'등급 → 목표 '+p.target+'등급')+'<p class="muted">등급 차이가 작은 순서로 추천하는 체험용 친구예요.</p>'+[...peers].sort((a,b)=>distance(a)-distance(b)).map(a=>panel(a[0]+' · '+a[3],row('현재 '+a[1]+'등급 · 목표 '+a[2]+'등급',btn(p.requests.includes(a[0])?'신청 취소':'친구 신청','friend',a[0])))).join('')}
function distance(a){return Math.abs(p.grade-a[1])+Math.abs(p.target-a[2])}
function weekly(){let key=dateKey(new Date(startOfWeek()));return p.missions[key]||(p.missions[key]={notes:[],claimed:[]})}
const missionNames=['이번 주 60분 공부하기','문제 풀이 3회 설명하기','공동 학습 목표 기록하기'],limits=[60,3,1],prizes=[300,250,400];
function progress(i){return [Math.floor(elapsed(startOfWeek())/60),weekly().notes.filter(n=>n.i===1).length,weekly().notes.filter(n=>n.i===2).length][i]}
function missions(){return missionNames.map((t,i)=>panel(t,'<progress class="bar" max="'+limits[i]+'" value="'+progress(i)+'"></progress>'+row(Math.min(progress(i),limits[i])+' / '+limits[i]+' · '+prizes[i]+' 캐시',weekly().claimed.includes(i)?'수령 완료':btn(progress(i)>=limits[i]?'보상 받기':i?'활동 기록':'공부 시작','mission',i)))).join('')+'<div class="grid">'+goBtn('보상 상점','상점')+goBtn('문제 몬스터','배틀')+'</div>'}
function shop(){return '<p class="pill">보유 '+p.cash+' 캐시</p>'+clothes.map((c,i)=>panel(c,p.outfit===i?'착용 중':btn(p.owned.includes(i)?'착용하기':[0,40,85][i]+' 캐시로 구매','buy',i))).join('')+panel('생기부 컨설팅 체험권',p.ticket?'활동 기록에 진로와의 연관성, 배운 점, 다음 계획을 적어 보세요.':btn('200 캐시로 활동 정리 안내 열기','ticket'))}
function profile(){return panel(escName(),'<span class="pill">'+jobs[p.job]+'</span> '+esc(p.career)+' · '+esc(p.univ)+'<p>'+esc(p.goal)+'</p>'+row('이번 주',clock(elapsed(startOfWeek())))+row('총 공부 시간',clock(elapsed()))+p.subjects.map(s=>row(esc(s),'<progress max="'+Math.max(1,elapsed())+'" value="'+elapsed(0,s)+'"></progress>')).join(''))+'<div class="grid">'+['목표','직업','배틀','랭킹','등급 환산','플레이리스트','상점'].map(t=>goBtn(t,t)).join('')+btn('로그아웃','logout')+'</div>'}
function escName(){return p.name+'의 학습 현황'}
function ranks(){return ['순공시간','푼 문제 수'].map((t,i)=>panel(t,[[p.name+' (나)',i?p.cleared.length+Object.values(p.dungeons||{}).reduce((n,d)=>n+d.step,0):elapsed()],['은하 (예시)',i?4:3600],['하늘 (예시)',i?2:1800]].sort((a,b)=>b[1]-a[1]).map((a,k)=>row((k+1)+' · '+esc(a[0]),i?a[1]+'문제':clock(a[1]))).join(''))).join('')+panel('명예의 전당','나래 · 목표 대학 합격 (예시)')}

if(i===1)return '입력한 현재 평균은 '+p.grade+'등급, 목표는 '+p.target+'등급이에요. '+s+'에 누적 '+Math.floor(elapsed(0,s)/60)+'분을 기록했어요. 다음 연습에서 오답을 개념·계산·해석으로 나누고 가장 많은 유형부터 복습해 보세요.';
if(i===2)return planFor(s);
if(/집중|미루|시작/.test(text))return s+' 책에서 지금 풀 문제 하나만 표시해 보세요. 타이머로 5분 동안 첫 줄까지 풀고, 끝나면 다음 5분에 할 일을 정해 보세요.';
return s+'에서 막힌 문제 하나를 고르고, 이해한 마지막 단계와 처음 막힌 단계를 각각 한 줄씩 써 보세요. 어떤 단원인지 다음 질문에 적어 주세요.'}
async function askMentor(text){if(mentorBusy||!text)return;mentorBusy=true;const owner=p,i=mentorTopic,s=subjectFor(text),fallback=guidance(text,i,s);let reply=fallback,mode='학습 기록 기반 안내',session;
render();
try{const opts={expectedOutputs:[{type:'text',languages:['ko']}]};
if(globalThis.LanguageModel && await LanguageModel.availability(opts)==='available'){
session=await LanguageModel.create(opts);
const answer=await session.prompt('한국어 학습 멘토로서 3문장 이내로 답하세요. 입시 결과를 예측하지 마세요. 상담 주제 '+mentorTopics[i]+', 희망 진로 '+owner.career+', 현재/목표 등급 '+owner.grade+'/'+owner.target+', 학습 참고 정보 '+fallback+'\n학생 질문: '+text,{signal:AbortSignal.timeout(20000)});
if(answer.trim()){reply=answer.trim();mode='브라우저 AI 답변'}}}
catch{}finally{session?.destroy();mentorBusy=false}
(owner.mentorChat??=[]).push({question:text,reply,mode});owner.mentorChat=owner.mentorChat.slice(-30);save();if(owner===p&&page==='학습 멘토')render()}

if(!right){d.streak=0;d.notice='공격 실패! 다시 생각해 보세요.'}else{d.step++;d.streak++;d.notice='명중! 몬스터의 HP가 줄었어요.';if(d.step%3===0){p.cash+=30;p.xp+=50;d.notice='몬스터 처치! 50 XP와 30 P를 받았어요. 다음 스테이지가 열렸어요.'}}save();render()}

function render(){let views={'학습 멘토':mentorPage,'스터디 던전':dungeonPage,'홈':home,'타이머':timer,'친구':friends,'미션':missions,'마이페이지':profile,'상점':shop,'목표':goals,'랭킹':ranks,'첫 테스트':()=>'<p>'+ (q+1)+' / 5</p>'+quiz(q),'문제':()=>quiz(battle),'배틀':()=>subs.map((s,i)=>panel(monsters[i],row(s+' · '+jobs[i],btn(p.cleared.includes(i)?'다시 풀기':'도전','fight',i)))).join(''),'직업':()=>jobs.map((j,i)=>btn(j+(p.job===i?' · 선택됨':''),'job',i,'wide')).join(''),'등급 환산':()=>'<form id="convert">'+field('석차','rank','number','','required min="1"')+field('전체 인원','size','number','','required min="1"')+'<button>예상 등급 계산</button><output id="result"></output></form><small>단순 누적 비율 기준이며 동점자는 반영하지 않아요.</small>','플레이리스트':()=>panel('과목별 집중 사운드','<p>과목별로 음색이 다른 연주를 재생해요.</p>'+subs.map((s,i)=>btn(s+' 연주','music',i,'wide')).join('')+btn('재생 중지','silence','','wide'))};
app.innerHTML=p?'<div class="brand">Playning</div>'+(page==='홈'?'':'<h1>'+esc(page==='학습 멘토'?'AI STUDY MENTOR':page==='스터디 던전'?'STUDY DUNGEON':page==='미션'?'WEEKLY MISSIONS':page==='타이머'?'STUDY TIMER':page)+'</h1>')+views[page]():auth();nav.innerHTML=p?.ready?tabs.map((t,i)=>'<button data-act="go" data-arg="'+t+'" class="'+(t===page?'active':'')+'"><b>'+['⌂','◷','♧','⚑','◎'][i]+'</b>'+t+'</button>').join(''):'';tick()}
function tick(){if(!p||page!=='타이머')return;$('#sum').textContent=clock(elapsed());document.querySelectorAll('[data-clock]').forEach(el=>el.textContent=clock(elapsed(0,p.subjects[el.dataset.clock])))}
function silence(){clearInterval(musicTick);if(audio){audio.close();audio=null}}
function music(i){silence();audio=new AudioContext();let k=0;function note(){let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=i%2?'triangle':'sine';o.frequency.value=[220,261.63,329.63,392,329.63,261.63][k++%6]*[1,.75,1.25,.875,1.125][i];g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.075,t+.12);g.gain.exponentialRampToValueAtTime(.001,t+1.4);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+1.45)}note();musicTick=setInterval(note,750+i*100);say(subs[i]+' 연주 중')}
async function verifier(pass,salt){let enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);let bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:120000},key,256);return Array.from(new Uint8Array(bits),v=>v.toString(16).padStart(2,'0')).join('')}
document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));try{if(f.getAttribute('id')==='mentorAsk'){await askMentor(v.question.trim());return}if(f.getAttribute('id')==='auth'){let key='u_'+v.id.toLowerCase();if(page==='회원가입'){if(db.users[key])return say('이미 사용 중인 아이디예요.');if(v.pwd!==v.confirm)return say('비밀번호 확인이 일치하지 않아요.');let salt=Array.from(crypto.getRandomValues(new Uint32Array(4))).join('-');db.users[key]={...fresh(v.name.trim()),phone:v.phone,salt,hash:await verifier(v.pwd,salt)};save()}else if(!db.users[key]||await verifier(v.pwd,db.users[key].salt)!==db.users[key].hash)return say('아이디 또는 비밀번호를 확인해 주세요.');openUser(key)}
else if(f.getAttribute('id')==='goals'){Object.assign(p,v);save();q=0;hits=[];go(p.ready?'홈':'첫 테스트')}
else if(f.getAttribute('id')==='subject'){let s=v.subject.trim();if(!s||p.subjects.includes(s))return say('다른 과목명을 입력해 주세요.');p.subjects.push(s);save();render()}
else if(f.getAttribute('id')==='convert'){let n=100*v.rank/v.size;$('#result').textContent=n>100?'석차가 전체 인원보다 큽니다.':'상위 '+n.toFixed(2)+'% · 예상 '+(1+[4,11,23,40,60,77,89,96,100].findIndex(x=>n<=x))+'등급'}
}catch(err){say('브라우저에서 저장 또는 인증을 사용할 수 없어요. Chrome이나 Edge에서 열어 주세요.')}})
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,v=b.dataset.arg,i=Number(v);
switch(a){case 'go':return go(v);case 'guest':if(!db.users.guest){db.users.guest={...fresh('체험 모험가'),ready:true,grade:3,target:2,minutes:60,career:'진로 탐색',univ:'목표 대학 미정',goal:''};save()}return openUser('guest');
case 'logout':stop();silence();sessionStorage.removeItem(store);p=null;return go('로그인');
case 'check':if(!p.attendance.includes(dateKey())){p.attendance.push(dateKey());p.cash+=20;p.xp+=10}break;
case 'timer':{let s=p.subjects[i],was=p.running?.subject===s;stop();if(!was)p.running={subject:s,start:Date.now()};break}
case 'answer':if(page==='첫 테스트'){if(i===quizzes[q][4])hits.push(q);if(++q===5){p.job=hits[0]??0;p.ready=true;save();say('첫 테스트 '+hits.length+'/5 · '+jobs[p.job]);return go('홈')}}else{if(i!==quizzes[battle][4])return say('다시 생각해 보세요.');if(!p.cleared.includes(battle)){p.cleared.push(battle);p.cash+=15;p.xp+=25}save();say('정답이에요!');return go('배틀')}break;
case 'topic':mentorTopic=i;break;
case 'makePlan':p.studyPlan=planFor(subjectFor(p.mentorChat?.at(-1)?.question||''));say('학습 계획을 저장했어요.');break;
case 'dsubject':dungeonSubject=i;selectedAnswer=null;break;
case 'pick':selectedAnswer=i;break;
case 'attack':return attack();
case 'fight':battle=i;return go('문제');case 'job':p.job=i;break;
case 'friend':p.requests=p.requests.includes(v)?p.requests.filter(n=>n!==v):[...p.requests,v];break;
case 'mission':{let w=weekly();if(w.claimed.includes(i))return;if(progress(i)>=limits[i]){w.claimed.push(i);p.cash+=prizes[i];p.xp+=20}else if(!i)return go('타이머');else{let text=prompt(missionNames[i]);if(!text?.trim())return;w.notes.push({i,text:text.trim()})}break}
case 'buy':if(!p.owned.includes(i)){let cost=[0,40,85][i];if(p.cash<cost)return say('캐시가 부족해요.');p.cash-=cost;p.owned.push(i)}p.outfit=i;break;
case 'ticket':if(p.cash<200)return say('200 캐시가 필요해요.');if(!p.ticket){p.cash-=200;p.ticket=true}break;
case 'music':return music(i);case 'silence':silence();return say('재생을 중지했어요.')}
save();render()});
render();setInterval(tick,500);
</script></html>
